name: Core

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
  merge_group:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release Vector')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VECTOR_BUILD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VECTOR_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check translations
        run: |
          python3 manager/tools/check_translations.py manager/src/main/res
          python3 manager/tools/check_translations.py daemon/src/main/res

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_UPSTREAM: ${{ github.repository_owner == 'HazY-Codes' }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_STORE" ]; then
            if [ "$IS_UPSTREAM" = "true" ]; then
              echo "::error::KEY_STORE is empty on ${{ github.ref }}. Refusing to publish an unsigned build."
              exit 1
            fi
            echo "No signing secret on this fork; building unsigned."
            exit 0
          fi
          {
            echo "androidStorePassword=$KEY_STORE_PASSWORD"
            echo "androidKeyAlias=$ALIAS"
            echo "androidKeyPassword=$KEY_PASSWORD"
            echo "androidStoreFile=key.jks"
          } >> gradle.properties
          printf '%s' "$KEY_STORE" | base64 --decode > key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle properties
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.13.2

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/build.gradle*') }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Build with Gradle
        run: |
          ./gradlew zipAll

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          set -euo pipefail
          zygiskReleaseName=$(basename zygisk/release/Vector-SRX-v*-Release.zip .zip)
          zygiskDebugName=$(basename zygisk/release/Vector-SRX-v*-Debug.zip .zip)
          versionName=$(echo "$zygiskDebugName" | sed -E 's/^Vector-SRX-(v[^-]+)-([0-9]+)-Debug$/\1/')
          versionCode=$(echo "$zygiskDebugName" | sed -E 's/^Vector-SRX-(v[^-]+)-([0-9]+)-Debug$/\2/')
          echo "zygiskReleaseName=$zygiskReleaseName" >> "$GITHUB_OUTPUT"
          echo "zygiskDebugName=$zygiskDebugName" >> "$GITHUB_OUTPUT"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          unzip zygisk/release/Vector-SRX-v*-Release.zip -d Vector-SRX-Release
          unzip zygisk/release/Vector-SRX-v*-Debug.zip -d Vector-SRX-Debug

      - name: Upload zygisk release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseName }}
          path: "./Vector-SRX-Release/*"

      - name: Upload zygisk debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskDebugName }}
          path: "./Vector-SRX-Debug/*"

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: |
            zygisk/build/outputs/mapping
            manager/build/outputs/mapping
            daemon/build/outputs/mapping

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: |
            zygisk/build/symbols
            daemon/build/symbols
            dex2oat/build/symbols

      - name: Publish release
        if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(printf '# 🎉 Vector-SRX %s 🎉\n\n%s\n' "${TAG#v}" "$(cat zygisk/changelog.md)")

          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "Vector-SRX ${TAG}" \
            --notes "$notes" \
            zygisk/release/Vector-SRX-v*-Release.zip \
            zygisk/release/Vector-SRX-v*-Debug.zip

      - name: Publish canary prerelease
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.prepareArtifact.outputs.versionCode }}
          VERSION_NAME: ${{ steps.prepareArtifact.outputs.versionName }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          tag="canary-${VERSION_CODE}"
          subject=$(git log -1 --pretty=%s)
          short=$(git rev-parse --short HEAD)

          notes=$(cat <<EOF
          **${subject}**

          Built from [\`${short}\`](${COMMIT_URL}) by [run ${{ github.run_id }}](${RUN_URL}).

          This is a canary build of \`master\` for **Vector-SRX**.

          | Build | Use it when |
          | :-- | :-- |
          | \`Vector-SRX-${VERSION_NAME}-${VERSION_CODE}-Debug.zip\` | Troubleshooting soft-reboot, reinjection, or module issues (verbose logging). |
          | \`Vector-SRX-${VERSION_NAME}-${VERSION_CODE}-Release.zip\` | Daily use with the latest fixes and optimizations. |

          Only the five most recent canaries are kept.
          EOF
          )

          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Vector-SRX ${VERSION_NAME} canary ${VERSION_CODE}" \
            --notes "$notes" \
            zygisk/release/Vector-SRX-v*-Release.zip \
            zygisk/release/Vector-SRX-v*-Debug.zip

      - name: Keep only the five most recent canaries
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^canary-' || true)
          [ -n "$tags" ] || exit 0
          echo "$tags" | sort -t- -k2 -n -r | tail -n +6 | while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --yes --cleanup-tag
          done
